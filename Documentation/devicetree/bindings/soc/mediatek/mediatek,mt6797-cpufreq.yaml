%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-cpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 CPU frequency and voltage coordination block

maintainers:
  - X20 Bring-up <x20@localhost>

description: |
  Board-level coordination window for the MT6797 cpufreq driver: mixed
  MCU/top clock registers, the HW semaphore and the INFRACFG bus. The
  operating points themselves are supplied per-CPU-cluster via
  operating-points-v2 tables referenced by the CPU nodes. A read-only
  clock provider exposes LL, L, BIG and CCI as indices 0 through 3; rate
  changes remain coordinated with the CPU and CCI voltage votes.

properties:
  compatible:
    const: mediatek,mt6797-cpufreq

  "#clock-cells":
    const: 1

  reg:
    items:
      - description: MCUSYS mixed clock registers
      - description: TOPCKGEN registers shared with the clock controller
      - description: DVFS hardware semaphore
      - description: INFRACFG SRAM LDO registers

  reg-names:
    items:
      - const: mcumixed
      - const: topckgen
      - const: semaphore
      - const: infracfg

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    cpufreq@1001a000 {
        compatible = "mediatek,mt6797-cpufreq";
        reg = <0x1001a000 0x1000>,
              <0x10000000 0x1000>,
              <0x11015000 0x1000>,
              <0x10001000 0x1000>;
        reg-names = "mcumixed", "topckgen", "semaphore", "infracfg";
        #clock-cells = <1>;
    };
...
