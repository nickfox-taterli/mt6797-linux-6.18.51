%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-cpufreq.yaml#
$title: MediaTek MT6797 CPU frequency and voltage coordination block

maintainers:
  - X20-96 board port

description: |
  Board-level coordination window for the MT6797 cpufreq driver: mixed
  MCU/top clock registers, the HW semaphore and the INFRACFG bus. The
  operating points themselves are supplied per-CPU-cluster via
  operating-points-v2 tables referenced by the CPU nodes.

properties:
  compatible:
    const: mediatek,mt6797-cpufreq

  reg:
    minItems: 4
    maxItems: 4

  reg-names:
    items:
      - const: mcumixed
      - const: topckgen
      - const: semaphore
      - const: infracfg

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    cpufreq@1001a000 {
        compatible = "mediatek,mt6797-cpufreq";
        reg = <0 0x1001a000 0 0x1000>,
              <0 0x10000000 0 0x1000>,
              <0 0x11015000 0 0x1000>,
              <0 0x10001000 0 0x1000>;
        reg-names = "mcumixed", "topckgen", "semaphore", "infracfg";
    };
...
