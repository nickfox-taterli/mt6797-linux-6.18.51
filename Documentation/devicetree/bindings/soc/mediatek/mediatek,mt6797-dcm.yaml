%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-dcm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 bus and CPU dynamic clock management

maintainers:
  - TaterLi <admin@taterli.com>

description: |
  Controls the infrastructure and peripheral bus dynamic clock gating fields
  in the shared INFRACFG syscon and the static MCUSYS fields via firmware.
  ARMCORE DCM shares MCUMIXED access with the CPUFreq supplier, including
  its software lock, hardware semaphore and register bridge workarounds.
  MEM/DFS_MEM fields use their latched APB configuration sequences. CPU sync
  DCM is managed by CPUFreq; DRAM PLLs and DDR PHY are not configured here.

properties:
  compatible:
    const: mediatek,mt6797-dcm
  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: INFRACFG always-on syscon
  mediatek,cpufreq:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MT6797 CPUFreq device owning the shared MCUMIXED access
  clocks:
    maxItems: 1
  clock-names:
    const: axi

required:
  - compatible
  - mediatek,infracfg
  - mediatek,cpufreq
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    dcm {
        compatible = "mediatek,mt6797-dcm";
        mediatek,infracfg = <&infracfg>;
        mediatek,cpufreq = <&cpufreq>;
        clocks = <&topckgen 1>;
        clock-names = "axi";
    };
