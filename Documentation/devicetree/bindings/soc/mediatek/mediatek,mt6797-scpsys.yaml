%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-scpsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 System Control Processor System (SCPSYS)

maintainers:
  - X20 Bring-up <x20@localhost>

description: |
  The System Control Processor System holds the System Power Manager (SPM)
  which controls the MT6797 MTCMOS power domains, bus protection and
  the GPU SRAM rail sequencing. This binding covers the MT6797 power
  controller; the generic power-domain consumer contract is defined by
  power/power-domain.yaml and the domain indices live in
  include/dt-bindings/power/mt6797-power.h.

  All non-SCM bus-protection and GPU SRAM rail registers live inside the
  INFRACFG register space, so every domain access goes through the single
  infracfg syscon regmap referenced below.

$ref: /schemas/power/power-domain.yaml#

patternProperties:
  "^(vdec|venc|isp|mm|audio|mfg_async|mfg|mfg_core[0-3]|mjc)-supply$":
    description: Power supply for the named power domain.

properties:
  compatible:
    const: mediatek,mt6797-scpsys

  reg:
    maxItems: 1

  infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the INFRACFG syscon controller.

  clocks:
    minItems: 3
    maxItems: 4
    description: |
      Clocks which must be enabled before the matching power domains can be
      enabled. The mfg52m asynchronous clock is only required when the
      MFG_ASYNC domain is in use.

  clock-names:
    oneOf:
      - items:
          - const: mfg
          - const: mm
          - const: vdec
      - items:
          - const: mfg
          - const: mm
          - const: vdec
          - const: mfg52m

required:
  - compatible
  - reg
  - infracfg
  - clocks
  - clock-names
  - "#power-domain-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt6797-clk.h>

    scpsys: power-controller@10006000 {
        compatible = "mediatek,mt6797-scpsys";
        reg = <0 0x10006000 0 0x1000>;
        infracfg = <&infrasys>;
        #power-domain-cells = <1>;
        clocks = <&topckgen CLK_TOP_MUX_MFG>,
                 <&topckgen CLK_TOP_MUX_MM>,
                 <&topckgen CLK_TOP_MUX_VDEC>,
                 <&infrasys CLK_INFRA_MFG_VCG>;
        clock-names = "mfg", "mm", "vdec", "mfg52m";
        mfg_async-supply = <&vgpu>;
    };
...
