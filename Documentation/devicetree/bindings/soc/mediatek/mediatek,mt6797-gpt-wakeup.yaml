%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-gpt-wakeup.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 APXGPT4 suspend wake timer

maintainers:
  - X20 Bring-up <x20@localhost>

description: |
  GPT4 is the BSP low power wake timer. It uses the 32kHz source while the
  architectural timer tick is stopped. GPT2 supplies the nonstop suspend
  clocksource used to account for sleep time. Bootloader interrupt masks
  are cleared when Linux takes ownership of the APXGPT page.

properties:
  compatible:
    const: mediatek,mt6797-gpt-wakeup
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 1
  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - wakeup-source

additionalProperties: false
