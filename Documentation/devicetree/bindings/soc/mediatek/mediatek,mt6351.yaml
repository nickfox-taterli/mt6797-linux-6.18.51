%YAML 1.2
---
$schema: http://devicetree.org/meta-schemas/core.yaml#

$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6351.yaml#

title: MediaTek MT6351 Power Management IC

description: |
  MT6351 PMIC exposed as a child of the MT6797 PMIC wrapper. The
  regulators sub-node carries the mediatek,mt6351-regulator compatible and
  one child per MT6351 regulator (ldo_*/buck_* node names, matching the
  mt6351-regulator driver names).

maintainers:
  - X20-96 board port

properties:
  compatible:
    const: mediatek,mt6351

  regulators:
    type: object

    properties:
      compatible:
        const: mediatek,mt6351-regulator

    patternProperties:
      "^(ldo_|buck_)[a-z0-9_-]+$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

    additionalProperties: false

    required:
      - compatible

required:
  - compatible

additionalProperties: false

examples:
  - |
    pmic {
        compatible = "mediatek,mt6351";
        regulators {
            compatible = "mediatek,mt6351-regulator";
            ldo_vmch {
                regulator-name = "vmch";
                regulator-min-microvolt = <3300000>;
                regulator-max-microvolt = <3300000>;
            };
        };
    };
...
