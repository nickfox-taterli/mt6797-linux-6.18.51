%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6797-venc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 AVC and HEVC encoder

# This workspace has no public maintainer address assigned.
maintainers: []

description: |
  Firmware-free V4L2 memory-to-memory encoder. The kernel programs the
  engine and its generated event controller, owns reconstructed pictures,
  and uses the associated SMI larb and translated M4U ports for DMA.

properties:
  compatible:
    const: mediatek,mt6797-venc
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    minItems: 3
    maxItems: 3
  power-domains:
    maxItems: 1
  mediatek,larb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SMI larb serving the encoder.
  iommus:
    minItems: 11
    maxItems: 11

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - power-domains
  - mediatek,larb
  - iommus

additionalProperties: false
...
