%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/mediatek,mt6351-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 PMIC real-time clock through PMIC wrapper

maintainers:
  - MediaTek Linux mailing list <linux-mediatek@lists.infradead.org>

description: |
  The MT6351 RTC registers are accessed through the MT6797 PMIC wrapper.
  This binding describes the timekeeping function when no PMIC interrupt
  controller is available. Alarm and wakeup are not provided in this mode.

properties:
  compatible:
    const: mediatek,mt6351-rtc

  mediatek,pwrap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMIC wrapper providing the MT6351 register map.

required:
  - compatible
  - mediatek,pwrap

additionalProperties: false

examples:
  - |
    pwrap: syscon {
        compatible = "syscon";
    };

    rtc {
        compatible = "mediatek,mt6351-rtc";
        mediatek,pwrap = <&pwrap>;
    };
...
