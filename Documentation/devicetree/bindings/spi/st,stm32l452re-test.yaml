%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/st,stm32l452re-test.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STM32L452RE laboratory SPI target

maintainers:
  - X20 Board Maintainers <x20@localhost>

description: |
  STM32L452RE running the X20 test-peer firmware. A host utility arms a
  full-duplex sequence/length/CRC transfer through an independent UART.
  The SPI endpoint is accessed through an explicit spidev driver override.

allOf:
  - $ref: spi-peripheral-props.yaml#

properties:
  compatible:
    const: st,stm32l452re-test
  reg:
    maxItems: 1
  spi-max-frequency:
    maximum: 12000000

required:
  - compatible
  - reg
  - spi-max-frequency

unevaluatedProperties: false
